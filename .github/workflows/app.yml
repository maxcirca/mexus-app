# The Mexus Android app on EAS (Expo), ADR-004 and ADR-009.
# - Push to main: staging. A change to native code builds a new
#   "Mexus Staging" APK; anything else ships as an over-the-air update on
#   the `staging` channel, so the installed app picks it up without
#   reinstalling.
# - Pull request: preview. The same, but as the separate "Mexus Preview"
#   app: updates go to the branch pr-<number>, the `preview` channel is
#   pointed at it (the latest pull request wins), and a comment on the pull
#   request links the APK. Nothing reaches the staging app before Merge.
# Needs the EXPO_TOKEN repository secret (docs/ACCESS.md).
name: App

on:
  push:
    branches: [main]
    paths: &app-paths
      - apps/app/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  pull_request:
    paths: *app-paths
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  eas:
    name: eas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build profile and channel in eas.json, and the environment the app
      # config reads (EAS builds get it from eas.json; over-the-air updates
      # are bundled here on the runner).
      PROFILE: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      MEXUS_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      UPDATE_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'staging' }}
      BUILDS_URL: https://expo.dev/accounts/ember-holdings/projects/mexus/builds
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # One-time: creates the Expo project if the app config doesn't name one
      # yet and prints its ID, which then goes into app.config.ts.
      - name: Expo project
        id: project
        working-directory: apps/app
        run: |
          if npx expo config --json | node -e 'const c=JSON.parse(require("fs").readFileSync(0));process.exit(c.extra?.eas?.projectId?0:1)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            eas init --non-interactive --force || true
            echo "::warning::No Expo project ID in app.config.ts yet; copy the ID printed above into it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Build a new APK only when native code changed (a new fingerprint);
      # otherwise publish an over-the-air update for the installed app.
      - name: Build or update
        id: deploy
        if: steps.project.outputs.ready == 'true'
        working-directory: apps/app
        env:
          MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Manual run' }}
        run: |
          fingerprint=$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
          echo "Android fingerprint ($PROFILE): $fingerprint"
          builds=$(eas build:list --platform android --build-profile "$PROFILE" --fingerprint-hash "$fingerprint" --limit 5 --json --non-interactive)
          build_id=$(echo "$builds" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s).filter(x=>x.status!=="ERRORED"&&x.status!=="CANCELED");console.log(b[0]?.id||"")})')
          if [ -z "$build_id" ]; then
            echo "Native code changed: starting a new $PROFILE build."
            eas build --platform android --profile "$PROFILE" --non-interactive --no-wait --json > build.json
            build_id=$(node -e 'console.log(require("./build.json")[0].id)')
            summary="A new **Mexus ${PROFILE^}** APK is building (about 10 minutes): $BUILDS_URL/$build_id. Install it from that page once it's finished."
          else
            echo "Build $build_id matches; publishing an over-the-air update to $UPDATE_BRANCH."
            eas update --branch "$UPDATE_BRANCH" --platform android --environment preview --message "${MESSAGE%%$'\n'*}" --non-interactive
            if [ "$PROFILE" = preview ]; then
              eas channel:edit preview --branch "$UPDATE_BRANCH" --non-interactive \
                || { eas channel:create preview --non-interactive && eas channel:edit preview --branch "$UPDATE_BRANCH" --non-interactive; }
            fi
            summary="Published as an over-the-air update: open **Mexus ${PROFILE^}** twice to get it. (Its APK, if you need to install it: $BUILDS_URL/$build_id.)"
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Tell the pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.summary
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.deploy.outputs.summary }}
        run: |
          body="**Phone (Mexus Preview):** $SUMMARY"
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --edit-last --body "$body" \
            || gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --body "$body"
